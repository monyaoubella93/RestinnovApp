server {
    listen 80;

    # Matches the largest upload the app validates (photo uploads, 10 MB
    # max), with headroom for the rest of the multipart form.
    client_max_body_size 20m;

    # Laravel: the API itself, Sanctum's CSRF-cookie route (unused by this
    # app's bearer-token auth, but harmless to route through), and the
    # health check. Handed to the PHP front controller exactly like the dev
    # config already does.
    location ~ ^/(api|sanctum|up)(/|$) {
        root /var/www/public;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Uploaded files (checklist/ticket/signalement photos, audio messages,
    # etc.) -- served directly from storage/app/public via "alias", NOT
    # through the public/storage symlink that `php artisan storage:link`
    # creates. That symlink is relative ("../storage/app/public") and only
    # resolves correctly if storage/app/public is reachable at the same
    # path relative to public/ inside THIS container too -- true when nginx
    # mounts the whole repo, but broken (dangling symlink, 404s on every
    # uploaded file) the moment its mount is narrowed to just ./public for
    # better isolation (see docker-compose.prod.yml, which mounts
    # ./storage/app/public separately for exactly this reason). Aliasing
    # here means uploaded files keep working regardless of that mount
    # layout, and even if storage:link itself ever failed to run.
    location /storage/ {
        alias /var/www/storage/app/public/;
    }

    location ~ \.php$ {
        root /var/www/public;
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Everything else: the built React SPA (baked into this image at build
    # time -- see Dockerfile.prod). Served from /srv/frontend-dist, not
    # /var/www/frontend-dist: the "nginx" service's ".:/var/www:ro" bind
    # mount (above, for public/ and the storage:link symlink) would otherwise
    # shadow anything baked into the image under /var/www at container
    # start. Client-side routing means any unknown path falls back to
    # index.html.
    location / {
        root /srv/frontend-dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
