<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/favicon-manager.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Séjours & ménage</title>

    <!-- Manager identity by default; AppShell/AgentWorkspace swap these to
         the /menage or /maintenance identity at runtime (manifest, favicon,
         theme-color, apple-touch-icon) so each route is installable as its
         own separate PWA icon. See README.md "Installer sur mobile". -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Séjours" />
    <link rel="apple-touch-icon" href="/icons/icon-192-manager.png" />

    <!-- Refonte UI : Instrument Sans (titres/interface), JetBrains Mono
         (chiffres/références), Noto Sans Arabic (doublons arabe côté agents). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+Arabic:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
